version: 2

project_name: codeprint

before:
  hooks:
    - go mod tidy

builds:
  - id: codeprint
    main: ./cmd/codeprint
    binary: codeprint
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      # NFR-3 targets: linux amd64/arm64, darwin amd64/arm64, windows amd64.
      - goos: windows
        goarch: arm64

archives:
  - id: codeprint
    # Friendly, visually-distinct names: macos/linux/windows + x86_64/arm64
    # (x86_64 vs arm64 is unambiguous, unlike amd64 vs arm64).
    name_template: 'codeprint_{{ .Version }}_{{ if eq .Os "darwin" }}macos{{ else }}{{ .Os }}{{ end }}_{{ if eq .Arch "amd64" }}x86_64{{ else }}{{ .Arch }}{{ end }}'
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - CHANGELOG.md
      - LICENSE*
      - NOTICE
      - schema/codeprint-v1.schema.json

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  # Keep release notes a short, meaningful feat/fix summary — exclude merge
  # commits, non-conventional history, and noise (docs/chore/ci/build/test).
  filters:
    exclude:
      - '^docs'
      - '^test'
      - '^chore'
      - '^ci'
      - '^build'
      - '^style'
      - '^refactor'
      - 'Merge pull request'
      - 'Merge branch'
      - 'Initial project setup'
      - 'Finalize brand'
      - 'Confirm design phase'
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1

release:
  github:
    owner: ShadowOpenTech
    name: codeprint
  prerelease: auto # v0.x.y-rc.* are flagged pre-release
  header: |
    Curated summary: [CHANGELOG.md](https://github.com/ShadowOpenTech/codeprint/blob/main/CHANGELOG.md).
    Binaries below: linux & macOS (amd64 + arm64), windows (amd64), with sha256 `checksums.txt`.

# Distribution is GitHub Releases (above) + the Go module proxy (automatic on
# tag, via `go install`). codeprint is open source; no private artifact registry.
