name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install tools
        run: |
          go install mvdan.cc/gofumpt@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Format check (gofumpt)
        run: test -z "$(gofumpt -l .)" || { echo 'run: make fmt'; gofumpt -l .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        run: golangci-lint run

      - name: Schema drift gate
        run: go run ./cmd/schemagen -check schema/codeprint-v1.schema.json

      - name: Test (race)
        run: go test -race ./...

      - name: Coverage gate
        run: make cover

      - name: govulncheck
        run: govulncheck ./...

      - name: Static build (no CGo) + offline build property
        env:
          CGO_ENABLED: '0'
        run: |
          go build -o /tmp/codeprint ./cmd/codeprint
          # Build with the module cache only and networking disabled to assert
          # no build-time network dependency beyond fetched modules.
          GOFLAGS=-mod=mod GOPROXY=off go build -o /dev/null ./cmd/codeprint
